[project]
name = "afterlife-ingest"
version = "0.1.0"
description = "Scrape London hackathon projects from Devpost, enrich with GitHub, load into Supabase and Cognee"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "selectolax>=1.0",
  "python-dotenv>=1.0",
  "supabase>=2.10",
  "cognee>=0.3",
]

[project.scripts]
afterlife-ingest = "afterlife_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterlife_ingest"]
